<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>中国象棋 · Jev 对战</title>
    <script type="module" src="/src/envs/chess/ui.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f6f3ee; color: #2a2621; }
        #show { display: grid; grid-template-columns: 280px minmax(620px, 1fr) 280px; min-height: 100vh; }
        .side-panel { padding: 20px; background: #fffdf9; border-right: 1px solid #e5ddd1; }
        #infoPanel { border-right: 0; border-left: 1px solid #e5ddd1; }
        .panel-title { margin: 0 0 14px; font-size: 16px; }
        #promptLog { height: min(72vh, 680px); overflow: auto; margin: 0; padding: 12px; border: 1px solid #ded4c6; border-radius: 8px; background: #27231f; color: #dff2e4; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
        .key-label { display: block; margin: 18px 0 6px; font-size: 13px; font-weight: 600; }
        #jevKeyInput { width: 100%; padding: 8px; border: 1px solid #cfc5b8; border-radius: 6px; }
        .hint { margin: 7px 0 0; color: #6b6258; font-size: 12px; line-height: 1.45; }
        #game { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 24px; background: #f2d7a0; }
        canvas { max-width: 100%; height: auto; background: #f7e1b5; border: 3px solid #333; }
        .info-card { padding: 16px; border: 1px solid #e2d8cb; border-radius: 10px; background: #fff; }
        .info-row { padding: 13px 0; border-bottom: 1px solid #eee7de; }
        .info-row:last-child { border-bottom: 0; }
        .info-label { display: block; margin-bottom: 5px; color: #786e62; font-size: 12px; }
        .info-value { display: block; font-size: 15px; font-weight: 600; line-height: 1.45; }
        button { width: 100%; margin-top: 16px; padding: 9px; color: #fff; background: #8d4d2d; border: 0; border-radius: 6px; cursor: pointer; }
        button:hover { background: #733d23; }
        @media (max-width: 1050px) { #show { grid-template-columns: 230px minmax(500px, 1fr) 230px; } }
        @media (max-width: 820px) { #show { grid-template-columns: 1fr; } .side-panel, #infoPanel { border: 0; border-bottom: 1px solid #e5ddd1; } #promptLog { height: 220px; } }
    </style>
</head>
<body>
    <main id="show">
        <aside class="side-panel" aria-label="Jev 请求日志">
            <h2 class="panel-title">发送给 Jev 的 JSON</h2>
            <pre id="promptLog">尚未发送请求。红方走棋后将在这里显示本回合的 Jev 请求。</pre>
            <label class="key-label" for="jevKeyInput">Jev API Key</label>
            <input id="jevKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="留空则使用服务端默认 Key">
            <p class="hint">仅保存在本浏览器标签页；不会显示在请求日志中。</p>
        </aside>

        <section id="game">
            <canvas id="board" width="600" height="670"></canvas>
        </section>

        <aside id="infoPanel" class="side-panel" aria-label="对局信息">
            <h2 class="panel-title">对局信息</h2>
            <div class="info-card">
                <div class="info-row"><span class="info-label">当前回合</span><strong id="turnInfo" class="info-value">红方（你）</strong></div>
                <div class="info-row"><span class="info-label">行动信息</span><span id="actionInfo" class="info-value">等待红方走棋</span></div>
            </div>
            <button id="resetBtn">重置对局</button>
        </aside>
    </main>

    <script type="module">
        import { reset } from "/src/envs/chess/ui.js";
        document.getElementById('resetBtn').addEventListener('click', reset);

        const jevKeyInput = document.getElementById('jevKeyInput');
        jevKeyInput.value = sessionStorage.getItem('jevApiKey') || '';
        jevKeyInput.addEventListener('input', () => {
            const key = jevKeyInput.value.trim();
            if (key) sessionStorage.setItem('jevApiKey', key);
            else sessionStorage.removeItem('jevApiKey');
        });

        window.addEventListener('jev-request', ({ detail }) => {
            document.getElementById('promptLog').textContent = JSON.stringify(detail, null, 2);
        });
    </script>
</body>
</html>
